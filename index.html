<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aaron Ratz</title>
<meta name="description" content="Aaron Ratz – Marketing, AI & Automation. Save my contact or connect on LinkedIn.">
<meta name="robots" content="noindex, nofollow">
<meta name="format-detection" content="telephone=no, email=no, address=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0E0F12">
<meta name="apple-mobile-web-app-title" content="Aaron Ratz">
<meta property="og:title" content="Aaron Ratz">
<meta property="og:description" content="Marketing, AI & Automation">
<meta property="og:type" content="profile">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230E0F12'/%3E%3Ctext x='32' y='42' font-family='Times New Roman,serif' font-size='28' text-anchor='middle' fill='%23EDEEF0'%3EAR%3C/text%3E%3C/svg%3E">
<link rel="preload" href="fonts/crimson-pro.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: "Crimson Pro";
    src: url("fonts/crimson-pro.woff2") format("woff2");
    font-weight: 200 900;
    font-display: swap;
  }

  /* Farben nach der Karte: mattes Schwarz, Silber */
  :root {
    --matt: #0E0F12;
    --text: #EDEEF0;
    --leise: #8B8F96;
    --linie: rgba(237, 238, 240, .12);
    /* Rahmen von Bedienelementen: mind. 3:1 zum Hintergrund (WCAG 1.4.11) */
    --rahmen: rgba(237, 238, 240, .42);
    --rahmen-hover: rgba(237, 238, 240, .64);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    background: var(--matt);
    /* kein Nachfedern, wenn die Seite ohnehin auf den Bildschirm passt */
    overscroll-behavior: none;
  }
  body {
    margin: 0;
    background: var(--matt);
    color: var(--text);
    font: 400 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  main {
    max-width: 400px;
    min-height: 100vh;
    min-height: 100svh;
    margin: 0 auto;
    padding:
      max(24px, env(safe-area-inset-top))
      max(24px, env(safe-area-inset-right))
      max(24px, env(safe-area-inset-bottom))
      max(24px, env(safe-area-inset-left));
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
  }

  /* feste Breite und Höhe statt aspect-ratio: Safari hat das Bild sonst im Flex-Layout verzerrt */
  .portrait {
    display: block;
    flex: none;
    width: 140px;
    height: 140px;
    margin: 0 auto;
    border-radius: 50%;
    object-fit: cover;
    background: #1B1D22;
    box-shadow: 0 0 0 1px var(--rahmen);
  }

  h1 {
    margin: 28px 0 0;
    font: 500 52px/1.05 "Crimson Pro", "Times New Roman", serif;
    letter-spacing: -0.005em;
  }
  .titel {
    margin: 8px 0 0;
    color: var(--leise);
  }

  /* Abstände auf 4-px-Raster; Blöcke (Kopf, Knöpfe, Kontakt) jeweils 32 px auseinander */
  .aktionen {
    margin-top: 32px;
    display: grid;
    gap: 12px;
  }
  .knopf {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 52px;
    padding: 0 20px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .005em;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: transform .1s ease, opacity .1s ease, background-color .15s ease, box-shadow .15s ease;
  }
  /* Antipp-Rückmeldung; greift auf iOS nur dank ontouchstart am body */
  .knopf:active { transform: scale(.98); opacity: .8; }
  .speichern { background: var(--text); color: var(--matt); }
  .linkedin { color: var(--text); box-shadow: inset 0 0 0 1px var(--rahmen); }
  @media (hover: hover) {
    .speichern:hover { background: #FFFFFF; }
    .linkedin:hover { box-shadow: inset 0 0 0 1px var(--rahmen-hover); }
  }

  .direkt {
    margin: 32px 0 0;
    padding: 0;
    list-style: none;
  }
  .direkt li { border-top: 1px solid var(--linie); }
  .direkt li:last-child { border-bottom: 1px solid var(--linie); }
  /* Beschriftung links, Wert rechts: symmetrisch zur zentrierten Achse darüber */
  .direkt a {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 0;
    color: var(--text);
    text-decoration: none;
    overflow-wrap: anywhere;
    -webkit-tap-highlight-color: transparent;
    transition: opacity .1s ease;
  }
  .direkt a:active { opacity: .6; }
  .direkt span {
    flex: none;
    color: var(--leise);
    font-size: 14px;
  }
  /* Wert mit Pfeil für die Profil-Zeile */
  .direkt i {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-style: normal;
  }
  .direkt i svg { width: 16px; height: 16px; color: var(--leise); }

  /* dezent: Weitergeben ist eine Nebenaktion, kein dritter großer Knopf */
  .teilen {
    align-self: center;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    margin-top: 16px;
    padding: 0 12px;
    border: 0;
    background: none;
    color: var(--leise);
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: opacity .1s ease, color .15s ease;
  }
  .teilen svg { width: 16px; height: 16px; }
  .teilen:active { opacity: .6; }
  @media (hover: hover) { .teilen:hover { color: var(--text); } }

  a:focus-visible, .teilen:focus-visible {
    outline: 2px solid var(--text);
    outline-offset: 3px;
    border-radius: 10px;
  }
  .direkt a:focus-visible { border-radius: 4px; }

  /* mittlere Höhen (iPhone 13/14 mit Safari-Leisten) */
  @media (min-height: 601px) and (max-height: 720px) {
    .portrait { width: 120px; height: 120px; }
    h1 { margin-top: 22px; }
    .direkt { margin-top: 28px; }
  }

  /* niedrige Bildschirme (iPhone SE mit Safari-Leisten): alles ohne Scrollen */
  @media (max-height: 600px) {
    main { padding-top: max(12px, env(safe-area-inset-top)); padding-bottom: max(8px, env(safe-area-inset-bottom)); }
    .portrait { width: 84px; height: 84px; }
    h1 { margin-top: 12px; font-size: 38px; }
    .titel { margin-top: 4px; }
    .aktionen { margin-top: 20px; }
    .direkt { margin-top: 20px; }
    .direkt a { padding: 10px 0; }
    .teilen { margin-top: 4px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .knopf, .direkt a, .teilen { transition: none; }
    .knopf:active { transform: none; }
  }
</style>
</head>
<body ontouchstart="">
<main>
  <img class="portrait" src="profil.jpg" alt="Portrait of Aaron Ratz" width="140" height="140">

  <h1>Aaron Ratz</h1>
  <p class="titel">Marketing, AI &amp; Automation</p>

  <div class="aktionen">
    <!-- ohne download-Attribut, damit iOS-Safari direkt „Kontakt hinzufügen“ zeigt; ?v= bei jeder vCard-Änderung erhöhen, sonst liefert der Cache die alte Datei -->
    <a class="knopf speichern" href="aaron-ratz.vcf?v=4">Save contact</a>
    <a class="knopf linkedin" href="https://www.linkedin.com/in/aaron-ratz" rel="noopener">Connect on LinkedIn</a>
  </div>

  <ul class="direkt">
    <li><a href="tel:+4915901690347"><span>Phone</span>+49 1590 1690347</a></li>
    <li><a href="mailto:aaron.ratz@icloud.com"><span>Email</span>aaron.ratz@icloud.com</a></li>
    <li><a href="profile/"><span>Profile</span><i>CV &amp; credentials<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></i></a></li>
  </ul>

  <button class="teilen" type="button" aria-live="polite">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
    <span>Share this card</span>
  </button>
</main>
<script>
  // Teilt die Seiten-URL über das System-Teilen-Menü; ohne Web Share API (Desktop) wird der Link kopiert.
  const teilen = document.querySelector(".teilen");
  const beschriftung = teilen.querySelector("span");
  teilen.addEventListener("click", async () => {
    const url = location.origin + location.pathname;
    if (navigator.share) {
      try { await navigator.share({ title: "Aaron Ratz", text: "Aaron Ratz – Marketing, AI & Automation", url }); } catch (e) { /* abgebrochen */ }
      return;
    }
    try {
      await navigator.clipboard.writeText(url);
      beschriftung.textContent = "Link copied";
    } catch (e) {
      beschriftung.textContent = url;
    }
    setTimeout(() => { beschriftung.textContent = "Share this card"; }, 2000);
  });
</script>
</body>
</html>
