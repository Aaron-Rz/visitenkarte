<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aaron Ratz</title>
<meta name="description" content="Aaron Ratz – Marketing, AI & Automation. Save my contact or connect on LinkedIn.">
<meta name="robots" content="noindex, nofollow">
<meta name="format-detection" content="telephone=no, email=no, address=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0E0F12">
<meta name="apple-mobile-web-app-title" content="Aaron Ratz">
<meta property="og:title" content="Aaron Ratz">
<meta property="og:description" content="Marketing, AI & Automation">
<meta property="og:type" content="profile">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230E0F12'/%3E%3Ctext x='32' y='42' font-family='Times New Roman,serif' font-size='28' text-anchor='middle' fill='%23EDEEF0'%3EAR%3C/text%3E%3C/svg%3E">
<link rel="preload" href="fonts/crimson-pro.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: "Crimson Pro";
    src: url("fonts/crimson-pro.woff2") format("woff2");
    font-weight: 200 900;
    font-display: swap;
  }

  /* Farben nach der Karte: mattes Schwarz, Silber */
  :root {
    --matt: #0E0F12;
    --text: #EDEEF0;
    --leise: #8B8F96;
    --linie: rgba(237, 238, 240, .12);
    /* Rahmen von Bedienelementen: mind. 3:1 zum Hintergrund (WCAG 1.4.11) */
    --rahmen: rgba(237, 238, 240, .42);
    --rahmen-hover: rgba(237, 238, 240, .64);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    background: var(--matt);
    /* kein Nachfedern, wenn die Seite ohnehin auf den Bildschirm passt */
    overscroll-behavior: none;
  }
  body {
    margin: 0;
    background: var(--matt);
    color: var(--text);
    font: 400 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  main {
    max-width: 400px;
    min-height: 100vh;
    min-height: 100svh;
    margin: 0 auto;
    padding:
      max(24px, env(safe-area-inset-top))
      max(24px, env(safe-area-inset-right))
      max(24px, env(safe-area-inset-bottom))
      max(24px, env(safe-area-inset-left));
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
  }

  /* feste Breite und Höhe statt aspect-ratio: Safari hat das Bild sonst im Flex-Layout verzerrt */
  .portrait {
    display: block;
    flex: none;
    width: 140px;
    height: 140px;
    margin: 0 auto;
    border-radius: 50%;
    object-fit: cover;
    background: #1B1D22;
    box-shadow: 0 0 0 1px var(--rahmen);
  }

  h1 {
    margin: 28px 0 0;
    font: 500 52px/1.05 "Crimson Pro", "Times New Roman", serif;
    letter-spacing: -0.005em;
  }
  .titel {
    margin: 8px 0 0;
    color: var(--leise);
  }

  /* Abstände auf 4-px-Raster; Blöcke (Kopf, Knöpfe, Kontakt) jeweils 32 px auseinander */
  .aktionen {
    margin-top: 32px;
    display: grid;
    gap: 12px;
  }
  .knopf {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 52px;
    padding: 0 20px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .005em;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: transform .1s ease, opacity .1s ease, background-color .15s ease, box-shadow .15s ease;
  }
  /* Antipp-Rückmeldung; greift auf iOS nur dank ontouchstart am body */
  .knopf:active { transform: scale(.98); opacity: .8; }
  .speichern { background: var(--text); color: var(--matt); }
  .linkedin { color: var(--text); box-shadow: inset 0 0 0 1px var(--rahmen); }
  @media (hover: hover) {
    .speichern:hover { background: #FFFFFF; }
    .linkedin:hover { box-shadow: inset 0 0 0 1px var(--rahmen-hover); }
  }

  .direkt {
    margin: 32px 0 0;
    padding: 0;
    list-style: none;
  }
  .direkt li { border-top: 1px solid var(--linie); }
  .direkt li:last-child { border-bottom: 1px solid var(--linie); }
  /* Beschriftung links, Wert rechts: symmetrisch zur zentrierten Achse darüber */
  .direkt a {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 0;
    color: var(--text);
    text-decoration: none;
    overflow-wrap: anywhere;
    -webkit-tap-highlight-color: transparent;
    transition: opacity .1s ease;
  }
  .direkt a:active { opacity: .6; }
  .direkt span {
    flex: none;
    color: var(--leise);
    font-size: 14px;
  }

  a:focus-visible {
    outline: 2px solid var(--text);
    outline-offset: 3px;
    border-radius: 10px;
  }
  .direkt a:focus-visible { border-radius: 4px; }

  /* niedrige Bildschirme (iPhone SE mit Safari-Leisten): alles ohne Scrollen */
  @media (max-height: 600px) {
    .portrait { width: 116px; height: 116px; }
    h1 { margin-top: 20px; font-size: 46px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .knopf, .direkt a { transition: none; }
    .knopf:active { transform: none; }
  }
</style>
</head>
<body ontouchstart="">
<main>
  <img class="portrait" src="profil.jpg" alt="Portrait of Aaron Ratz" width="140" height="140">

  <h1>Aaron Ratz</h1>
  <p class="titel">Marketing, AI &amp; Automation</p>

  <div class="aktionen">
    <!-- ohne download-Attribut, damit iOS-Safari direkt „Kontakt hinzufügen“ zeigt; ?v= bei jeder vCard-Änderung erhöhen, sonst liefert der Cache die alte Datei -->
    <a class="knopf speichern" href="aaron-ratz.vcf?v=3">Save contact</a>
    <a class="knopf linkedin" href="https://www.linkedin.com/in/aaron-ratz" rel="noopener">Connect on LinkedIn</a>
  </div>

  <ul class="direkt">
    <li><a href="tel:+4915901690347"><span>Phone</span>+49 1590 1690347</a></li>
    <li><a href="mailto:aaron.ratz@icloud.com"><span>Email</span>aaron.ratz@icloud.com</a></li>
  </ul>
</main>
</body>
</html>
